plugins {
	id 'java-library'
	id 'application'
}

repositories {
	mavenCentral()
}

sourceSets {
	main {
		resources {
			srcDirs "src/main/resources", "../../4th"
		}
	}
}

application {
	mainClass = 'io.github.jordipbou.Sloth.REPL'
}

run {
	standardInput = System.in
}

dependencies {
	testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'
	api 'org.apache.commons:commons-math3:3.6.1'
	implementation 'com.google.guava:guava:32.1.3-jre'
}

tasks.named('test') {
	useJUnitPlatform()
}
